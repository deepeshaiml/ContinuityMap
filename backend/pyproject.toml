[project]
name = "continuitymap"
version = "0.1.0"
description = "Evidence-backed infrastructure dependency planning demo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "networkx==3.7",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "python-docx==1.2.0",
  "pypdf==6.21.2",
  "reportlab==5.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["continuitymap*"]
exclude = ["tests*"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]
